# ==============================================================================
# ReliefAI - Render Infrastructure Blueprint Specification (render.yaml)
# ==============================================================================
# Deploys:
#   1. Managed PostgreSQL database with automatic connection pooling
#   2. High-performance Next.js 16 Web Service running API routes and health probe
# ==============================================================================

services:
  - type: web
    name: reliefai-backend
    runtime: node
    region: singapore
    plan: starter
    buildCommand: npm run build:render
    startCommand: npm run start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: reliefai-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: "https://reliefai.vercel.app,http://localhost:3000"
      - key: TRUST_PROXY_HEADERS
        value: "true"
      - key: ADMIN_BOOTSTRAP_SECRET
        generateValue: true
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: NEXT_PUBLIC_GOOGLE_MAPS_KEY
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_API_KEY
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_PROJECT_ID
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: NEXT_PUBLIC_FIREBASE_APP_ID
        sync: false
      - key: NEXT_PUBLIC_OPERATIONAL_SECTOR
        value: BANGLADESH_NATIONAL_GRID
      - key: NEXT_PUBLIC_MESH_NODE_ID
        value: BD_DHAKA_CENTRAL_EOC
      - key: NEXT_PUBLIC_APP_URL
        sync: false

databases:
  - name: reliefai-db
    databaseName: reliefai
    user: reliefai_user
    region: singapore
    plan: starter
    ipAllowList: [] # Allows access only within Render internal network
